<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPY/QQQ Options</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#262b36; --fg:#e6e8ee; --dim:#8b93a7;
          --ok:#3ddc84; --bad:#ff5c5c; --warn:#ffb340; --accent:#6ea8ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:16px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0 12px 0 0; }
  .pill { padding:3px 10px; border-radius:999px; background:var(--card); border:1px solid var(--line); color:var(--dim); font-size:12px; }
  .pill.ok { color:var(--ok); border-color:var(--ok); } .pill.bad { color:var(--bad); border-color:var(--bad); } .pill.warn { color:var(--warn); border-color:var(--warn); }
  main { padding:16px 20px; display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(420px,1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .card h2 { margin:0 0 10px; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); }
  .big { font-size:28px; font-weight:600; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:4px 0; border-bottom:1px dashed var(--line); }
  .row:last-child { border-bottom:0; }
  .dim { color:var(--dim); }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); }
  .sig { font-size:20px; font-weight:600; }
  .gate { padding:6px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .gate:last-child { border-bottom:0; }
  .gate b { display:inline-block; width:18px; }
  .bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin-top:6px; }
  .bar i { display:block; height:100%; background:var(--accent); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:500; }
  pre { white-space:pre-wrap; font-size:12px; color:var(--fg); }
  .wide { grid-column:1 / -1; }
  select { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:4px 8px; }
</style>
</head>
<body>
<header>
  <h1>SPY / QQQ Options</h1>
  <span id="mode" class="pill">—</span>
  <span id="conn" class="pill">—</span>
  <span id="mkt" class="pill">—</span>
  <span id="halt" class="pill" style="display:none">HALTED</span>
  <span id="age" class="pill">—</span>
  <span class="pill dim" id="limits">—</span>
</header>
<main>
  <section class="card">
    <h2>Account &amp; day</h2>
    <div class="big" id="equity">—</div>
    <div class="row"><span class="dim">Day</span><span id="day"></span></div>
    <div class="row"><span class="dim">Trades</span><span id="trades"></span></div>
    <div class="row"><span class="dim">Budget used</span><span id="budget"></span></div>
    <div class="bar"><i id="budgetbar" style="width:0"></i></div>
    <div class="row"><span class="dim">Realised today</span><span id="realized"></span></div>
    <div class="row"><span class="dim">Loss halt at</span><span id="losshalt"></span></div>
  </section>

  <section class="card" id="SPY"><h2>SPY</h2><div class="body"></div></section>
  <section class="card" id="QQQ"><h2>QQQ</h2><div class="body"></div></section>

  <section class="card wide">
    <h2>Open spreads</h2>
    <table id="open"><thead><tr><th>sym</th><th>dir</th><th>legs</th><th>qty</th><th>entry</th><th>mid</th><th>P&amp;L</th><th>peak</th><th>stop</th><th>since</th></tr></thead><tbody></tbody></table>
  </section>

  <section class="card wide">
    <h2>Today's decisions (ledger)</h2>
    <table id="ledger"><thead><tr><th>time</th><th>kind</th><th>sym</th><th>dir</th><th>result</th><th>detail</th></tr></thead><tbody></tbody></table>
  </section>

  <section class="card wide">
    <h2>Daily report <select id="reports"></select></h2>
    <pre id="report">—</pre>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
const money = v => (v<0?'−$':'$') + Math.abs(v).toLocaleString(undefined,{maximumFractionDigits:0});
const pct = v => (v>=0?'+':'') + (v*100).toFixed(0) + '%';

function symCard(sym, s, hist) {
  const el = document.querySelector('#'+sym+' .body');
  if (!s) { el.innerHTML = '<span class="dim">no scan yet</span>'; return; }
  const sg = s.signal, ind = s.indicators || {};
  let h = `<div class="row"><span class="dim">Price</span><span>${s.price ?? '—'}</span></div>`;
  h += `<div class="row"><span class="dim">Daily trend (20d SMA)</span><span class="${s.trend==='bull'?'ok':s.trend==='bear'?'bad':'dim'}">${s.trend ?? 'flat / no trade'}</span></div>`;
  h += `<div class="row"><span class="dim">EMA9 / RSI14</span><span>${ind.ema9 ?? '—'} / ${ind.rsi14 ?? '—'}</span></div>`;
  if (s.gap_pct != null) h += `<div class="row"><span class="dim">Opening gap</span><span class="${Math.abs(s.gap_pct)>=1?'warn':''}">${s.gap_pct>0?'+':''}${s.gap_pct}%</span></div>`;
  if (sg) {
    h += `<div class="sig ${sg.direction==='bull'?'ok':'bad'}">${sg.direction==='bull'?'▲ BUY CALL SPREAD':'▼ BUY PUT SPREAD'} <span class="dim" style="font-size:13px">${sg.setup} · strength ${sg.strength}${sg.also&&sg.also.length?' · also '+sg.also.join(', '):''}</span></div>`;
  } else {
    h += `<div class="sig dim">no signal</div>`;
  }
  // historical confidence per setup — the measured hit rate, not a score
  if (hist) {
    for (const [setup, byDir] of Object.entries(hist)) {
      for (const dir of ['bull','bear']) {
        const hr = byDir[dir]; if (!hr) continue;
        const active = sg && sg.setup===setup && sg.direction===dir;
        const lo = hr.lower95 ?? 0;
        h += `<div class="row" style="${active?'font-weight:600':''}"><span class="dim">${setup} ${dir==='bull'?'▲':'▼'}</span><span class="${lo>=0.55?'ok':lo>=0.35?'':'bad'}">${hr.lower95!=null?(hr.lower95*100).toFixed(0)+'%':'—'} <span class="dim" style="font-size:11px">(${hr.rate!=null?(hr.rate*100).toFixed(0)+'% hit, n='+hr.n:'n='+hr.n})</span></span></div>`;
      }
    }
  }
  if (s.candidate) {
    const c = s.candidate;
    h += `<div class="row"><span class="dim">Candidate</span><span>${c.long_strike}/${c.short_strike} ${c.type} ${c.expiry} (${c.dte}d) debit ${c.net_debit}</span></div>`;
  }
  if (s.gates && s.gates.length) {
    h += '<div style="margin-top:8px">';
    for (const g of s.gates) h += `<div class="gate"><b class="${g.ok?'ok':'bad'}">${g.ok?'✓':'✗'}</b>${g.text}</div>`;
    h += '</div>';
  }
  if (s.debate) h += `<div class="row"><span class="dim">Debate</span><span class="${s.debate.proceed?'ok':'bad'}">${s.debate.proceed?'PROCEED':'SUPPRESS'} ${(s.debate.confidence*100).toFixed(0)}% — ${s.debate.reason}</span></div>`;
  h += `<div class="dim" style="font-size:12px;margin-top:6px">scanned ${s.ts?.slice(11,19)} · ${s.bars} bars</div>`;
  el.innerHTML = h;
}

async function refresh() {
  try {
    const r = await fetch('/api/status'); if (!r.ok) throw 0;
    const s = await r.json();
    const age = Date.now()/1000 - s.epoch;
    $('#mode').textContent = s.mode.toUpperCase(); $('#mode').className = 'pill ' + (s.mode==='paper'?'ok':'warn');
    $('#conn').textContent = s.connected ? 'connected '+s.key_prefix+'…' : 'DISCONNECTED'; $('#conn').className = 'pill ' + (s.connected?'ok':'bad');
    $('#mkt').textContent = s.market_open ? 'market open' : 'market closed'; $('#mkt').className = 'pill ' + (s.market_open?'ok':'');
    $('#halt').style.display = s.halted ? '' : 'none'; $('#halt').className = 'pill bad';
    $('#age').textContent = 'updated ' + age.toFixed(0) + 's ago'; $('#age').className = 'pill ' + (age>120?'bad':'');
    const L = s.limits; $('#limits').textContent = `±${(L.tp_pct*100).toFixed(0)}% · window ${L.entry_window} · flatten ${L.flatten_at} · DTE ${L.dte} · ${L.debate_model}`;
    const a = s.account || {}; $('#equity').textContent = a.equity!=null ? money(a.equity) : '—';
    const d = s.day; $('#day').textContent = d.date; $('#trades').textContent = `${d.trades} / ${d.max_trades}`;
    $('#budget').textContent = `${money(d.debit_spent_usd)} / ${money(d.budget_usd)}`;
    $('#budgetbar').style.width = Math.min(100, d.debit_spent_usd/d.budget_usd*100)+'%';
    $('#realized').textContent = money(d.realized_usd); $('#realized').className = d.realized_usd>=0?'ok':'bad';
    $('#losshalt').textContent = '−'+money(d.loss_halt_usd);
    for (const sym of ['SPY','QQQ']) symCard(sym, s.signals?.[sym], s.history?.[sym]);
    const tb = $('#open tbody'); tb.innerHTML = '';
    for (const p of s.open) tb.innerHTML += `<tr><td>${p.sym}</td><td>${p.direction}</td><td>${p.long} / ${p.short}</td><td>${p.qty}</td><td>${p.entry}</td><td>${p.mid}</td><td class="${p.pnl_usd>=0?'ok':'bad'}">${money(p.pnl_usd)} (${p.pnl_pct}%)</td><td>${p.peak_pct}%</td><td>${p.stop} (t${p.tier})</td><td>${p.opened_at.slice(11,16)}</td></tr>`;
    if (!s.open.length) tb.innerHTML = '<tr><td colspan="10" class="dim">flat</td></tr>';
  } catch (e) { $('#conn').textContent = 'no status file'; $('#conn').className = 'pill bad'; }
  try {
    const rows = await (await fetch('/api/ledger')).json();
    const tb = $('#ledger tbody'); tb.innerHTML = '';
    for (const r of rows.slice().reverse()) {
      let res = '', det = '';
      if (r.kind==='decision') { res = r.accepted ? '<span class="ok">ACCEPTED</span>' : '<span class="bad">rejected</span>'; const f = (r.gates||[]).find(g=>!g.ok); det = f ? f.text : (r.confidence?.label||''); }
      else if (r.kind==='fill') { res = '<span class="ok">FILLED</span>'; det = `${r.long_occ}/${r.short_occ} x${r.qty} @ ${r.net_debit} (slip ${r.slippage})`; }
      else if (r.kind==='close') { res = `<span class="${(r.pnl_usd||0)>=0?'ok':'bad'}">${money(r.pnl_usd||0)}</span>`; det = `${r.reason} · ${r.pnl_pct}% · peak ${r.peak_pct}%`; }
      else { res = r.event || r.kind; det = JSON.stringify(Object.fromEntries(Object.entries(r).filter(([k])=>!['ts','kind','mode','setup','sym','event'].includes(k)))).slice(0,160); }
      tb.innerHTML += `<tr><td>${r.ts.slice(11,19)}</td><td>${r.kind}</td><td>${r.sym}</td><td>${r.direction||''}</td><td>${res}</td><td>${det}</td></tr>`;
    }
    if (!rows.length) tb.innerHTML = '<tr><td colspan="6" class="dim">nothing yet today</td></tr>';
  } catch (e) {}
}
async function loadReports() {
  const list = await (await fetch('/api/reports')).json();
  const sel = $('#reports'); sel.innerHTML = list.map(d=>`<option>${d}</option>`).join('') || '<option>none</option>';
  sel.onchange = showReport; if (list.length) showReport();
}
async function showReport() {
  const d = $('#reports').value; const r = await fetch('/api/report/'+d);
  $('#report').textContent = r.ok ? await r.text() : 'no report';
}
refresh(); loadReports(); setInterval(refresh, 15000); setInterval(loadReports, 300000);
</script>
</body>
</html>
