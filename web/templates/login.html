<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SPY/QQQ Desk</title>
<style>
  :root { --bg:#0a0c14; --card:#141826; --ink:#e7e9f3; --mute:#8a90a8; --line:#262b3d; --accent:#8b5cf6; --bad:#f43f5e; }
  @media (prefers-color-scheme: light) { :root { --bg:#f5f6fa; --card:#fff; --ink:#151827; --mute:#5d6378; --line:#e3e5ee; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font: 16px/1.4 Inter, system-ui, -apple-system, sans-serif; padding:16px; }
  form { width:100%; max-width:340px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px; }
  h1 { font-size:18px; margin:0 0 4px; } p { color:var(--mute); font-size:14px; margin:0 0 18px; }
  input { width:100%; padding:12px; font-size:16px; border-radius:10px; border:1px solid var(--line);
          background:transparent; color:var(--ink); }
  button { width:100%; margin-top:12px; padding:12px; font-size:16px; font-weight:600; border:0; border-radius:10px;
           background:var(--accent); color:#fff; cursor:pointer; }
  .err { color:var(--bad); font-size:14px; margin-top:10px; }
</style>
</head>
<body>
<form method="post" autocomplete="on">
  <h1>🧪 SPY/QQQ Desk</h1>
  {% if configured %}
  <p>Paper trading dashboard</p>
  <input type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus required>
  <button type="submit">Sign in</button>
  {% else %}
  <p>No password set. On the Mac run <code>spyqqq set-password</code>.</p>
  {% endif %}
  {% if err %}<div class="err">{{ err }}</div>{% endif %}
</form>
</body>
</html>
